# v4 = FULL end-to-end RE-RUN of the v3 full-param GRPO experiment from scratch, with the
# committed speed work enabled (server-side trinity_ppo loss + concurrent chunks + 12MB SDK
# cap + mask omitted + 32 runners). Same algorithm param lineage as v3 (repeat16 / lr5e-6 /
# kl_coef0.001 / train_batch_size7680 / batch16 / max_response512 / max_model_len8191 /
# enable_thinking false / full_param / grad_clip1.0), so the trainer/explorer reward curve
# can be compared against v3's curve step-for-step to verify the new code path reproduces
# the previous learning behavior (not just for 3 steps).
#
# Fresh checkpoint dir (name v4); auto-stops at 230 (just past v3's 224-step comparison
# window). Launch with TINKER_REF_LOGPROB_CONCURRENCY=1536.

mode: both
project: "ALFWORLD"
name: "Step_Wise_Alfworld_TuFT_8GPU_v4"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}

algorithm:
  algorithm_type: multi_step_grpo
  repeat_times: 16
  optimizer:
    lr: 5e-6
  kl_loss_fn_args:
    kl_coef: 0.001

model:
  model_path: ${oc.env:TRINITY_MODEL_PATH,Qwen/Qwen3-1.7B}
  max_response_tokens: 512
  max_model_len: 8191
  max_prompt_tokens: 7679
  enable_thinking: false
  tinker:
    enable: true
    base_url: ${oc.env:TINKER_BASE_URL,http://127.0.0.1:10610}
    full_param: true
    # committed speed work (validated in phases 4/5 + R1/R2/R3)
    forward_backward_chunk_bytes: 11500000
    forward_backward_max_inflight: 8
    server_loss_fn: "trinity_ppo"
    sdk_chunk_bytes_cap: 12000000
    server_loss_send_mask: false

cluster:
  ray_address: ${oc.env:TRINITY_RAY_ADDRESS,127.0.0.1:6393}
  node_num: 1
  gpu_per_node: 0

buffer:
  total_epochs: 100
  batch_size: 16
  train_batch_size: 7680
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: 'examples/grpo_alfworld/alfworld_data'
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
      enable_progress_bar: false
      default_workflow_type: 'step_wise_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_buffer
      storage_type: queue
      max_read_timeout: 10800
      replay_buffer:
        enable: true

explorer:
  max_repeat_times_per_runner: 1
  runner_per_model: 32
  max_timeout: 3600
  max_retry_times: 2
  eval_on_startup: false
  rollout_model:
    engine_type: tinker
    engine_num: 1
    enable_history: true
    seed: 42
  env_vars:
    TMPDIR: ${oc.env:TMPDIR,/tmp}
    ALFWORLD_DATA: ${oc.env:ALFWORLD_DATA,/mnt/workspace/kaixiang/alfworld_data}

synchronizer:
  sync_style: fully_async
  sync_method: memory
  sync_interval: 2
  sync_timeout: 3600

trainer:
  trainer_type: tinker
  total_steps: 230
  save_interval: 3
  enable_preview: true
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard

log:
  level: INFO
