# ALFWorld multi-step GRPO on TuFT, LoRA rank 32 x 7 target modules
# (q/k/v/o/gate/up/down) = 34.9M trainable params = 2.04% of Qwen3-1.7B.
#
# PURPOSE: LoRA-conventional learning-rate arm. Everything except lr matches the
# verl FULL-param reference (repeat_times 16, train_batch_size 7680, kl_coef 0.001,
# max_env_steps 30, max_response_tokens 512, max_model_len 8192).
#
# ⚠️ This is NOT a single-variable capacity contrast: lr differs from the full-param
# reference, so any comparison against verl must carry that caveat. Its purpose is
# to answer "can LoRA learn ALFWorld well", not "is capacity the bottleneck".
#
# WHY 5e-5: the matched-lr arm (lr 5e-6, run Step_Wise_Alfworld_TuFT_lora32_lr5e6_v2,
# 46 steps, report /mnt/workspace/kaixiang/2026-09-09_alfworld_lora32_rl_experiment_report_v2.md)
# showed LoRA learns ~15x slower than full-param -- 46 steps moved score/mean from
# -0.09159 to -0.06906 (+0.023) while verl reached +0.23 by step 40. The internal lr
# contrast proved the root cause is the learning rate, not parameter count: raising lr
# 10x (5e-6 -> 5e-5) increased policy movement 17.7x (ppo_kl) and 44.6x (kl_loss),
# i.e. superlinear. Mechanisms: LoRA's B matrix is zero-initialized so the adapter
# contributes nothing at first; the rank-32 bottleneck constrains each update to a
# 32-dim subspace; Adam's per-param step is ~lr, so 2.04% of params move far less of
# the function space than full-param does. LoRA-conventional lr is 1e-4..3e-4, i.e.
# 10-30x the full-FT lr. 5e-5 is chosen over 1e-4 because the older report recorded
# lr 1e-4 overshooting (ppo_kl 0.28 by step 5).
#
# WHY RE-RUN AT ALL: the earlier LoRA results (r8 flat for 34 steps; r32 peaking at
# 6.79% test success then collapsing) were produced BEFORE the bugs catalogued in the
# experiment report section 8.4 were fixed -- chunk remainders causing 422/NCCL hangs,
# std_threshold discarding zero-variance groups and starving the trainer, a fixed
# per-request seed making every GRPO repeat identical so advantage was 0, FSDP slot
# leaks, and the vLLM 0.24 CUDA illegal-memory-access crashes. Those conclusions are
# not trustworthy and must be redone on the fixed stack.
#
# Deviations from the verl reference that are forced by the tinker backend, not choices:
#   - sync_style fully_async (explorer_driven hard-blocks at sync boundaries: measured
#     strictly serial rollout+train ~17 min/step vs ~10 min overlapped)
#   - runner_per_model 16 (vLLM sampling-engine CUDA-crash mitigation; 8 would make
#     explore the bottleneck: 32 waves instead of 16, cycle 12.7 -> 18 min)
#   - save_interval 10 rather than 50 (crash history makes losing up to 50 steps
#     unacceptable; does not affect learning dynamics)
#
# NOTE: the 7-module target set is a TuFT SERVER-side config (lora_target_modules in
# tuft_config.yaml), not something Trinity passes -- the tinker SDK's
# create_lora_training_client_async only exposes rank/seed/train_mlp/train_attn/
# train_unembed. Do not cross-load checkpoints between this run and the r8 run: the
# adapter layouts differ and would shape-mismatch.
#
# Run with:
#   export TRINITY_MACHINE_ID=v2      # v1 / v2 / v3 -- required, tags all output paths
#   export RAY_ADDRESS=127.0.0.1:6393
#   export TINKER_BASE_URL=http://127.0.0.1:10610
#   export TINKER_API_KEY=tml-tuft-dev-key
#   export TINKER_TELEMETRY=0
#   export ALFWORLD_DATA=/mnt/workspace/kaixiang/alfworld_data
#   trinity run --config examples/grpo_alfworld_general_multi_step/alfworld_tuft_lora32.yaml

mode: both
project: "ALFWORLD"
# v1/v2/v3 share this checkout over one filesystem; the machine tag keeps their
# checkpoint/tensorboard/log paths apart. No default on purpose -- fail loudly.
# lr5e5 tag so this arm's data stays separate from the completed lr5e6 and klA arms.
name: "Step_Wise_Alfworld_TuFT_lora32_lr5e5_${oc.env:TRINITY_MACHINE_ID}"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}

algorithm:
  algorithm_type: multi_step_grpo
  repeat_times: 16
  optimizer:
    # 5e-5 = LoRA-conventional lr (10x the full-FT 5e-6). Justified empirically:
    # raising lr 10x increased policy movement 17.7x (ppo_kl) and 44.6x (kl_loss).
    # Reference points for interpreting ppo_kl:
    #   lr 5e-6 arm (46 steps): ppo_kl 0.00055 -> 0.00149, kl_loss 0.0006 -> 0.0369
    #   lr 5e-5 arm (this one, and the older klA arm): ppo_kl reached 0.0196 by step 4
    # Do NOT raise to 1e-4: the older report recorded it overshooting (ppo_kl 0.28 by
    # step 5). If ppo_kl climbs past ~0.05 by step 10 here, that is the same failure
    # mode and the run should be stopped rather than continued.
    lr: 5e-5
  # kl_coef 0.001 matches the verl full-param reference, which did not set
  # kl_loss_fn_args at all and therefore used the framework default (k2, 0.001).
  # Stated explicitly here so the match is visible rather than implicit.
  kl_loss_fn_args:
    kl_coef: 0.001

model:
  # Must be the name TuFT advertises in /api/v1/get_server_capabilities.
  model_path: ${oc.env:TRINITY_MODEL_PATH,Qwen/Qwen3-1.7B}
  max_response_tokens: 512
  # Crash fix (both lines). Server max_model_len=8192 fixed in Redis; compute_logprobs
  # keeps 1 output token (TuFT 141858c) → usable window 8191. model.py caps an
  # experience's token_ids at max_model_len-1, so 8191-1=8190 gives 8190+1=8191 ≤ 8192.
  # 7679+512=8191 ≤ 8191 satisfies config_validator. Matches v3's validated values.
  max_model_len: 8191
  max_prompt_tokens: 7679
  enable_thinking: false
  tinker:
    enable: true
    base_url: ${oc.env:TINKER_BASE_URL,http://127.0.0.1:10610}
    # rank 32 is the tinker SDK default and the server's new max_lora_rank.
    rank: 32
    # TuFT's FSDP backend cannot train the unembedding layer.
    train_unembed: false
    # Byte-budget packing so each chunk is exactly one SDK sub-request (the SDK
    # re-splits at its own 5MB limit and can leave a 1-datum remainder, which the
    # backend's FSDP rank guard rejects with a 422).
    forward_backward_chunk_bytes: 4500000

cluster:
  ray_address: ${oc.env:TRINITY_RAY_ADDRESS,127.0.0.1:6393}
  node_num: 1
  gpu_per_node: 0

buffer:
  total_epochs: 100
  batch_size: 16
  # One full explore round = 16 games x 16 repeats x 30 env steps.
  train_batch_size: 7680
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: 'examples/grpo_alfworld/alfworld_data'
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
      enable_progress_bar: false
      default_workflow_type: 'step_wise_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_buffer
      storage_type: queue
      max_read_timeout: 10800
      replay_buffer:
        enable: true

explorer:
  max_repeat_times_per_runner: 1
  # 16 (not 64): client-side mitigation for the recurring vLLM sampling-engine CUDA
  # crashes, whose signature included ~14 concurrent decodes per engine. 16 runners
  # over 3 engines = ~5 concurrent per engine, a third of the trigger surface.
  # Rollout ~12-15 min/round is acceptable (comparable to the ~10 min train step);
  # raise again after 4-6 crash-free hours.
  runner_per_model: 16
  max_timeout: 3600
  max_retry_times: 2
  eval_on_startup: false
  rollout_model:
    engine_type: tinker
    engine_num: 1
    enable_history: true
    seed: 42
  env_vars:
    TMPDIR: ${oc.env:TMPDIR,/tmp}
    ALFWORLD_DATA: ${oc.env:ALFWORLD_DATA,/mnt/workspace/kaixiang/alfworld_data}

synchronizer:
  # fully_async, NOT explorer_driven: with explorer_driven, need_sync() calls
  # finish_current_steps() at every sync_interval boundary, hard-blocking the
  # explorer (measured: strictly serial rollout+train, ~17 min/step, zero overlap).
  sync_style: fully_async
  sync_method: memory
  # 2 = the verl full-param reference cadence (was 1 in the previous LoRA run).
  sync_interval: 2
  sync_timeout: 3600

trainer:
  trainer_type: tinker
  # 250 steps to match the verl reference horizon. Early stop is proposed (not
  # automatic) if the round-level success rate plateaus or collapses; save_interval
  # 10 yields 25 checkpoints so any stop point is recoverable.
  total_steps: 250
  save_interval: 10
  enable_preview: true
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard

log:
  level: INFO
