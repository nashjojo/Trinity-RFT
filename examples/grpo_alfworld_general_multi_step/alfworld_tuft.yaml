# ALFWorld general multi-step GRPO, trained through the local TuFT server
# (Tinker-compatible backend) instead of a local veRL/vLLM GPU stack.
#
# Trinity only orchestrates here: rollouts and forward/backward both go to TuFT,
# which already owns all 8 GPUs (4x vLLM sampling + 4x FSDP training).
# So this config requests zero GPUs and runs on a separate CPU-only Ray cluster.
#
# Run with:
#   export TINKER_BASE_URL=http://127.0.0.1:10610
#   export TINKER_API_KEY=tml-tuft-dev-key
#   export TINKER_TELEMETRY=0
#   export ALFWORLD_DATA=/mnt/workspace/kaixiang/alfworld_data
#   trinity run --config examples/grpo_alfworld_general_multi_step/alfworld_tuft.yaml

mode: both
project: "ALFWORLD"
name: "Step_Wise_Alfworld_TuFT"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}

algorithm:
  algorithm_type: multi_step_grpo
  repeat_times: 8
  optimizer:
    lr: 5e-6
  kl_loss_fn_args:
    kl_coef: 0.0

model:
  # Must be the model name TuFT advertises in /api/v1/get_server_capabilities,
  # not a local filesystem path (ConfigValidator rejects anything else).
  model_path: ${oc.env:TRINITY_MODEL_PATH,Qwen/Qwen3-1.7B}
  max_response_tokens: 512
  max_model_len: 20480
  # Qwen3 is hybrid-thinking and defaults to emitting <think> blocks; the ALFWorld
  # workflow parses <action> tags, so thinking is turned off.
  enable_thinking: false
  tinker:
    enable: true
    base_url: ${oc.env:TINKER_BASE_URL,http://127.0.0.1:10610}
    rank: 8
    # TuFT's FSDP backend cannot train the unembedding layer.
    train_unembed: false

cluster:
  ray_address: ${oc.env:TRINITY_RAY_ADDRESS,127.0.0.1:6393}
  node_num: 1
  gpu_per_node: 0

buffer:
  total_epochs: 2
  batch_size: 4
  # TuFT shards each forward_backward across its 4 FSDP ranks and rejects a
  # batch smaller than 4, so keep this a multiple of 4.
  train_batch_size: 8
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: 'examples/grpo_alfworld/alfworld_data'
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
      enable_progress_bar: false
      default_workflow_type: 'step_wise_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_buffer
      storage_type: queue
      replay_buffer:
        enable: true

explorer:
  max_repeat_times_per_runner: 1
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_type: tinker
    engine_num: 1
    enable_history: true
    seed: 42

synchronizer:
  sync_style: explorer_driven
  sync_method: memory
  sync_interval: 1
  sync_timeout: 3600

trainer:
  trainer_type: tinker
  total_steps: 3
  save_interval: 50
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard

log:
  level: INFO
