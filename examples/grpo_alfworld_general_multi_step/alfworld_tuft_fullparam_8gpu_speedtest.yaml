# Speed-validation A/B: resumes the v3 run from step 224 for 4 steps with the two
# client-side speed optimizations enabled, then auto-stops (trainer.total_steps).
#
# Differences vs alfworld_tuft_fullparam_8gpu.yaml (everything else identical):
#   1. tinker.forward_backward_max_inflight: 8  -> chunk RPCs submitted concurrently
#      (baseline was sequential, 79 chunks x 2 round trips per step).
#   2. trainer.total_steps: 228                 -> 4 steps after the step-224 resume,
#      then training stops by itself.
#   3. Run with TINKER_REF_LOGPROB_CONCURRENCY=1536 to widen the ref-logprob pass.
#
# Diagnostics: time/ref (new) isolates the reference-logprob channel; time/update_actor
# isolates the chunked fwd/bwd path. Baseline medians (last 50 steps of v3):
#   train_step 939s = update_actor 544s + ref ~390s.
#
# Run with (same env as the main config, plus):
#   export TINKER_REF_LOGPROB_CONCURRENCY=1536
#   trinity run --config examples/grpo_alfworld_general_multi_step/alfworld_tuft_fullparam_8gpu_speedtest.yaml

mode: both
project: "ALFWORLD"
name: "Step_Wise_Alfworld_TuFT_8GPU_v3"
checkpoint_root_dir: ${oc.env:TRINITY_CHECKPOINT_ROOT_DIR,./checkpoints}

algorithm:
  algorithm_type: multi_step_grpo
  repeat_times: 16
  optimizer:
    lr: 5e-6
  kl_loss_fn_args:
    kl_coef: 0.001

model:
  model_path: ${oc.env:TRINITY_MODEL_PATH,Qwen/Qwen3-1.7B}
  max_response_tokens: 512
  max_model_len: 8191
  max_prompt_tokens: 7679
  enable_thinking: false
  tinker:
    enable: true
    base_url: ${oc.env:TINKER_BASE_URL,http://127.0.0.1:10610}
    full_param: true
    forward_backward_chunk_bytes: 4500000
    forward_backward_max_inflight: 8

cluster:
  ray_address: ${oc.env:TRINITY_RAY_ADDRESS,127.0.0.1:6393}
  node_num: 1
  gpu_per_node: 0

buffer:
  total_epochs: 100
  batch_size: 16
  train_batch_size: 7680
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: 'examples/grpo_alfworld/alfworld_data'
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
      enable_progress_bar: false
      default_workflow_type: 'step_wise_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_buffer
      storage_type: queue
      max_read_timeout: 10800
      replay_buffer:
        enable: true

explorer:
  max_repeat_times_per_runner: 1
  runner_per_model: 16
  max_timeout: 3600
  max_retry_times: 2
  eval_on_startup: false
  rollout_model:
    engine_type: tinker
    engine_num: 1
    enable_history: true
    seed: 42
  env_vars:
    TMPDIR: ${oc.env:TMPDIR,/tmp}
    ALFWORLD_DATA: ${oc.env:ALFWORLD_DATA,/mnt/workspace/kaixiang/alfworld_data}

synchronizer:
  sync_style: fully_async
  sync_method: memory
  sync_interval: 2
  sync_timeout: 3600

trainer:
  trainer_type: tinker
  total_steps: 228
  save_interval: 3
  enable_preview: true
  grad_clip: 1.0

monitor:
  monitor_type: tensorboard

log:
  level: INFO
