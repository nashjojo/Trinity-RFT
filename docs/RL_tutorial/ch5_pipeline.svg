<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6366f1"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0d9488"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <!-- ===== column headers ===== -->
  <text x="190" y="44" text-anchor="middle" fill="#4338ca" font-size="18" font-weight="700">explorer 端 · rollout</text>
  <text x="630" y="44" text-anchor="middle" fill="#b45309" font-size="18" font-weight="700">trainer 端 · update</text>

  <!-- ===== explorer panel ===== -->
  <rect x="40" y="60" width="300" height="296" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">
    <rect x="80" y="96" width="220" height="48" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="190" y="125">prompt（任务描述）</text>
    <rect x="80" y="184" width="220" height="48" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="190" y="213">ReAct in E2B sandbox</text>
    <rect x="80" y="272" width="220" height="48" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="190" y="301">trajectory（一条 rollout）</text>
  </g>
  <text x="190" y="341" text-anchor="middle" fill="#6366f1" font-size="12">8 prompt × G=8 → 64 条 trajectory</text>
  <!-- explorer internal arrows -->
  <line x1="190" y1="144" x2="190" y2="182" stroke="#6366f1" stroke-width="2" marker-end="url(#aI)"/>
  <line x1="190" y1="232" x2="190" y2="270" stroke="#6366f1" stroke-width="2" marker-end="url(#aI)"/>

  <!-- ===== trainer panel ===== -->
  <rect x="440" y="60" width="380" height="434" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#soft)"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <rect x="490" y="96" width="300" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="640" y="123" fill="#92400e">assemble 64 traj batch</text>
    <rect x="490" y="176" width="300" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="640" y="203" fill="#92400e">forward（4B base + LoRA）</text>
    <rect x="490" y="260" width="300" height="44" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="1.5"/>
    <text x="640" y="287" fill="#7e22ce">PPO loss（advantage + clip）</text>
    <rect x="490" y="344" width="300" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="640" y="371" fill="#92400e">LoRA grads（~15M params）</text>
    <rect x="490" y="428" width="300" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="640" y="455" fill="#15803d">updated LoRA → next rollout</text>
  </g>
  <!-- trainer internal arrows + labels -->
  <line x1="640" y1="140" x2="640" y2="174" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <line x1="640" y1="220" x2="640" y2="258" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="654" y="245" fill="#a16207" font-size="11.5">→ logprobs</text>
  <line x1="640" y1="304" x2="640" y2="342" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="654" y="329" fill="#a16207" font-size="11.5">→ backward</text>
  <line x1="640" y1="388" x2="640" y2="426" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="654" y="413" fill="#a16207" font-size="11.5">→ optim_step</text>

  <!-- ===== cross arrow: trajectory → assemble batch ===== -->
  <path d="M300 296 H390 V118 H488" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#aI)"/>
  <rect x="345" y="99" width="86" height="22" rx="11" fill="#6366f1"/>
  <text x="388" y="114" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">推 64 条经验</text>

  <!-- ===== weight sync arrow: updated LoRA → back to explorer ===== -->
  <path d="M640 472 V524 H190 V358" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aT)"/>
  <rect x="268" y="513" width="344" height="24" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="440" y="529" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="700">weight sync：仅传 ~31 MB LoRA 增量 → 下一轮 rollout</text>
</svg>
