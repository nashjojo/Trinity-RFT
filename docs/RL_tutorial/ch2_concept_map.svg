<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>

  <!-- ===== Layer 1: Step ===== -->
  <rect x="20" y="20" width="610" height="430" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#soft)"/>
  <text x="44" y="54" fill="#4338ca" font-size="19" font-weight="700">Step（一次训练步）</text>
  <text x="44" y="78" fill="#6366f1" font-size="13.5">= 8 个 prompt × G = 8 个采样 → 64 条 trajectory</text>

  <!-- ===== Layer 2: Trajectory ===== -->
  <rect x="48" y="96" width="554" height="338" rx="15" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="70" y="124" fill="#7e22ce" font-size="16.5" font-weight="700">Trajectory（一条 rollout）</text>
  <rect x="300" y="108" width="52" height="22" rx="11" fill="#a855f7"/>
  <text x="326" y="123" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">× 64</text>

  <!-- ===== Layer 3: ReAct loop ===== -->
  <rect x="72" y="146" width="506" height="182" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="92" y="172" fill="#b45309" font-size="15" font-weight="700">ReAct 多步循环</text>
  <text x="205" y="172" fill="#d97706" font-size="12.5">—— 本章主角</text>

  <!-- flow nodes -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="92" y="196" width="104" height="44" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="144" y="223" fill="#92400e">message_0</text>

    <rect x="228" y="196" width="104" height="44" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="280" y="216" fill="#92400e">tool_call</text>
    <text x="280" y="232" fill="#a16207" font-size="10.5" font-weight="400">思考→调工具</text>

    <rect x="364" y="196" width="118" height="44" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="423" y="216" fill="#92400e">tool_result</text>
    <text x="423" y="232" fill="#a16207" font-size="10.5" font-weight="400">看执行结果</text>
  </g>

  <!-- forward arrows -->
  <line x1="196" y1="218" x2="226" y2="218" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="332" y1="218" x2="362" y2="218" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="218" x2="512" y2="218" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="524" y="223" fill="#b45309" font-size="20" font-weight="700">…</text>

  <!-- loop-back arrow -->
  <path d="M423 240 C 423 286, 144 286, 144 242" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#loop)"/>
  <text x="284" y="303" fill="#d97706" font-size="12" text-anchor="middle">循环，直到完成任务或达到步数上限</text>

  <!-- score output -->
  <rect x="72" y="346" width="506" height="66" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="92" y="372" fill="#15803d" font-size="14" font-weight="700">最后产出：verifier 打分</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="300" y="356" width="46" height="26" rx="13" fill="#ffffff" stroke="#16a34a"/>
    <text x="323" y="374" fill="#166534">0</text>
    <rect x="354" y="356" width="56" height="26" rx="13" fill="#ffffff" stroke="#16a34a"/>
    <text x="382" y="374" fill="#166534">0.33</text>
    <rect x="418" y="356" width="56" height="26" rx="13" fill="#ffffff" stroke="#16a34a"/>
    <text x="446" y="374" fill="#166534">0.67</text>
    <rect x="482" y="356" width="52" height="26" rx="13" fill="#16a34a" stroke="#16a34a"/>
    <text x="508" y="374" fill="#ffffff">1.0</text>
  </g>
  <text x="92" y="399" fill="#15803d" font-size="11.5" font-weight="400">3 个 check 各占 1/3：全过=1.0，全失败=0</text>

  <!-- ===== right-side timing annotations ===== -->
  <g>
    <rect x="652" y="30" width="188" height="60" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="668" y="55" fill="#4338ca" font-size="14" font-weight="700">≈ 28 min / step</text>
    <text x="668" y="76" fill="#6366f1" font-size="11.5">64 条 trajectory 一批采样</text>

    <rect x="652" y="150" width="188" height="60" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="668" y="175" fill="#7e22ce" font-size="14" font-weight="700">≈ 5 min / trajectory</text>
    <text x="668" y="196" fill="#a855f7" font-size="11.5">一次完整 ReAct 循环</text>

    <rect x="652" y="196" width="188" height="60" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" transform="translate(0,54)"/>
    <text x="668" y="279" fill="#b45309" font-size="14" font-weight="700">≈ 30 sec / 步</text>
    <text x="668" y="300" fill="#d97706" font-size="11.5">思考 → 调工具 → 看结果</text>
  </g>

  <!-- footnote -->
  <text x="652" y="356" fill="#94a3b8" font-size="11">本章聚焦最内层：</text>
  <text x="652" y="374" fill="#64748b" font-size="11.5" font-weight="600">单条 trajectory 内部到底发生了什么</text>
</svg>
